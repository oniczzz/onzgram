name: onzgram build

# Собирает рабочий release-APK onzgram при каждом пуше в main.
# RELEASE_KEYSTORE не нужен: APK подписывается debug-ключом. Чтобы APK из
# разных запусков ставились поверх друг друга, debug.keystore кешируется
# между запусками (или берётся из необязательного секрета DEBUG_KEYSTORE,
# base64 от ~/.android/debug.keystore).
#
# Секреты:
#   LOCAL_PROPERTIES — base64 от local.properties (TELEGRAM_APP_ID,
#                      TELEGRAM_APP_HASH, MAPS_API_KEY, ...). Необязателен.
#   DEBUG_KEYSTORE   — base64 от debug.keystore. Необязателен.
#   TG_*             — отправка APK в Telegram. Необязательны.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub pre-release and post the APK to Telegram'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      NATIVE_TARGET: "universal"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Point Chaquopy at that Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(which python3.11 || which python)" >> $GITHUB_ENV
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Write local.properties
        env:
          LOCAL_PROPERTIES_B64: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          : > local.properties
          if [ -n "$LOCAL_PROPERTIES_B64" ]; then
            if printf '%s' "$LOCAL_PROPERTIES_B64" | base64 -d > local.properties 2>/dev/null; then
              echo "local.properties decoded from LOCAL_PROPERTIES"
            else
              # Секрет положен как обычный текст, а не base64.
              printf '%s\n' "$LOCAL_PROPERTIES_B64" > local.properties
              echo "LOCAL_PROPERTIES is not base64 — written as plain text"
            fi
          else
            echo "LOCAL_PROPERTIES is not set — building with default API keys"
          fi
          sed -i '/^sdk\.dir=/d' local.properties
          printf '\nsdk.dir=%s\n' "$ANDROID_HOME" >> local.properties
          echo "keys in local.properties:"
          sed 's/=.*//' local.properties | grep -v '^$' || true
      - name: Restore debug signing key from cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: onzgram-debug-keystore-v1
      - name: Restore debug signing key from secret
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE" ]; then
            printf '%s' "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "debug.keystore restored from DEBUG_KEYSTORE"
          elif [ -f ~/.android/debug.keystore ]; then
            echo "debug.keystore restored from cache"
          else
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
            echo "new debug.keystore generated (cached for the next runs)"
          fi
          # AGP берёт debug.keystore из ANDROID_USER_HOME, если он задан.
          if [ -n "$ANDROID_USER_HOME" ] && [ "$ANDROID_USER_HOME" != "$HOME/.android" ]; then
            mkdir -p "$ANDROID_USER_HOME"
            cp ~/.android/debug.keystore "$ANDROID_USER_HOME/debug.keystore"
          fi
          # Без release.keystore build.gradle подписывает APK отладочным ключом.
          rm -f TMessagesProj/release.keystore
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          cat gradle.properties
      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id || github.sha }}
        run: |
          # build.gradle читает local.properties, записанный шагом выше.
          unset LOCAL_PROPERTIES
          export BUILD_TIMESTAMP=$(date +%s)
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew TMessagesProj:assembleRelease
          ls -la TMessagesProj/build/outputs/apk/release/
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: onzgram-release
          path: |
            TMessagesProj/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish GitHub pre-release
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(github.event.head_commit.message, '[skip publish]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="ci-$SHORT"
          NOTES=$(jq -r '(.commits // []) | map("• " + (.message | split("\n")[0])) | join("\n")' "$GITHUB_EVENT_PATH")
          if [ -z "$NOTES" ]; then
            NOTES="CI build $SHORT"
          fi
          gh release create "$TAG" TMessagesProj/build/outputs/apk/release/*.apk \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "onzgram CI $SHORT" --notes "$NOTES"
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            -q '[.[] | select(.isPrerelease and (.tagName | startswith("ci-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --yes --cleanup-tag
            done
      - name: Send APK to Telegram
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(github.event.head_commit.message, '[skip publish]') }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "секреты Telegram не заданы — отправка пропущена"
            exit 0
          fi
          pip install --quiet kurigram tgcrypto
          python3 .github/scripts/send_apk.py
